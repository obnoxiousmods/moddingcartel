name: Build Windows Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create releases and upload artifacts
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: uv sync --group dev
    
    - name: Build executable with PyInstaller
      run: uv run pyinstaller moddingcartel.spec
    
    - name: List build output
      run: |
        dir dist
    
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: moddingcartel-windows
        path: dist/moddingcartel.exe
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/moddingcartel.exe
        body: |
          ## moddingcartel Windows Release
          
          Download `moddingcartel.exe` and double-click to run.
          A terminal window will open with the application.
          
          ### Requirements
          - Windows 10 or later
          - Network connection to ModdingCartel server
          - Nintendo Switch running Sphaira FTP server
          
          ### First Run
          1. Double-click `moddingcartel.exe`
          2. Enter your ModdingCartel credentials
          3. The app will discover your Switch on the network
          4. Start queuing games to send!
    
    - name: Get latest release
      if: github.event_name == 'workflow_dispatch'
      id: get_latest_release
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const { data: latestRelease } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput('upload_url', latestRelease.upload_url);
            core.setOutput('tag', latestRelease.tag_name);
            console.log(`Latest release: ${latestRelease.tag_name}`);
          } catch (error) {
            if (error.status === 404) {
              core.setFailed('No releases found. Manual workflow runs require at least one existing release. Please create a release first or push a tag to trigger automatic release creation.');
            } else {
              throw error;
            }
          }
    
    - name: Upload to latest release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_latest_release.outputs.tag }}
        files: dist/moddingcartel.exe
